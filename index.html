<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Talking Santa 3D</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Chalkboard SE', 'Comic Sans MS', sans-serif; background: #10264a; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 14px 18px; font-size: 24px; color: white; z-index: 5; text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: none; }
  #speech { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: white; border-radius: 24px; padding: 12px 20px; font-size: 22px; max-width: 86%; text-align: center; display: none; box-shadow: 0 6px 16px rgba(0,0,0,0.3); z-index: 6; }
  #status { position: fixed; bottom: 118px; width: 100%; text-align: center; color: white; font-size: 16px; z-index: 5; text-shadow: 0 2px 4px rgba(0,0,0,0.6); pointer-events: none; }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 12px 6px 24px; background: linear-gradient(#c62828, #8e1111); z-index: 7; }
  .btn { width: 66px; height: 66px; border-radius: 50%; border: 4px solid white; background: #ef5350; font-size: 30px; color: white; box-shadow: 0 4px 0 #6d0000; padding: 0; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #6d0000; }
  .btn.on { background: #43a047; box-shadow: 0 4px 0 #1b5e20; }
  #start { position: fixed; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 30%, #2d5f9a, #10264a); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
  #start h1 { font-size: 44px; margin: 0 0 10px; text-shadow: 0 3px 8px rgba(0,0,0,0.5); }
  #start p { font-size: 20px; margin: 0 0 26px; }
  #startBtn { font-size: 30px; padding: 18px 44px; border-radius: 44px; border: 4px solid white; background: #c62828; color: white; box-shadow: 0 6px 0 #7a0000; }
  #loading { margin-top: 18px; font-size: 16px; opacity: 0.8; }
  #game { position: fixed; inset: 0; background: linear-gradient(#0d2b52, #3b78b8); display: none; z-index: 20; }
  #gameTop { display: flex; justify-content: space-between; padding: 14px 18px; color: white; font-size: 24px; }
  .gift { position: absolute; font-size: 64px; }
  #closeGame { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); }
  #shop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 25; align-items: center; justify-content: center; }
  #shopBox { background: white; border-radius: 24px; padding: 20px; width: 88%; max-width: 380px; text-align: center; }
  .hatBtn { font-size: 38px; margin: 6px; padding: 8px 14px; border-radius: 16px; border: 3px solid #c62828; background: #fff; }
  .hatBtn small { display: block; font-size: 14px; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="start">
  <h1>Talking Santa</h1>
  <p>Tap the button, then just talk to Santa!</p>
  <button id="startBtn">Say Hello</button>
  <div id="loading">Loading Santa...</div>
</div>

<div id="top"><div>🪙 <span id="coins">0</span></div><div>❤️ <span id="happy">5</span></div></div>
<div id="speech"></div>
<div id="status"></div>

<div id="bar">
  <button class="btn" id="cookieBtn">🍪</button>
  <button class="btn" id="milkBtn">🥛</button>
  <button class="btn on" id="micBtn">🎤</button>
  <button class="btn" id="giftBtn">🎁</button>
  <button class="btn" id="shopBtn">🎩</button>
  <button class="btn on" id="musicBtn">🎵</button>
</div>

<div id="game">
  <div id="gameTop"><div>Score: <span id="score">0</span></div><div>⏱ <span id="timer">30</span></div></div>
  <button class="btn" id="closeGame">✖</button>
</div>

<div id="shop">
  <div id="shopBox">
    <h2>Santa's Hat Shop</h2>
    <div id="hatList"></div>
    <button class="btn" id="closeShop" style="margin-top:12px">✖</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// =====================================================================
//  PART 1: the 3D world and Santa
// =====================================================================

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10264a);
scene.fog = new THREE.Fog(0x10264a, 9, 22);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
camera.position.set(0, 1.55, 6.4);
camera.lookAt(0, 1.35, 0);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // on tall phone screens, pull the camera back a bit so Santa always fits
  camera.position.z = w / h < 0.7 ? 7.6 : 6.4;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x3a2418, 0.9));
const key = new THREE.DirectionalLight(0xfff1d6, 2.4);
key.position.set(3, 6, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -2;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0x88b8ff, 1.2);
rim.position.set(-4, 3, -3);
scene.add(rim);
const warm = new THREE.PointLight(0xffa24a, 12, 9);
warm.position.set(-2.6, 1.8, 1.8);
scene.add(warm);

// ---------- Room: floor, back wall, fireplace glow, tree ----------
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0xe9f1fb, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 14),
  new THREE.MeshStandardMaterial({ color: 0x1c3f73, roughness: 1 })
);
wall.position.set(0, 5, -5);
scene.add(wall);

// table for the cookie and milk
const table = new THREE.Group();
const tableTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.95, 0.95, 0.1, 32),
  new THREE.MeshStandardMaterial({ color: 0x8a5a33, roughness: 0.6 })
);
tableTop.position.y = 0.95;
tableTop.castShadow = true; tableTop.receiveShadow = true;
const tableLeg = new THREE.Mesh(
  new THREE.CylinderGeometry(0.12, 0.2, 0.95, 16),
  new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.7 })
);
tableLeg.position.y = 0.47;
tableLeg.castShadow = true;
table.add(tableTop, tableLeg);
table.position.set(-1.9, 0, 0.9);
scene.add(table);

// christmas tree in the back
const tree = new THREE.Group();
const greenMat = new THREE.MeshStandardMaterial({ color: 0x1f7a3a, roughness: 0.8 });
for (let i = 0; i < 4; i++) {
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.5 - i * 0.28, 1.3, 20), greenMat);
  cone.position.y = 1.2 + i * 0.85;
  cone.castShadow = true;
  tree.add(cone);
}
const star = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.22),
  new THREE.MeshStandardMaterial({ color: 0xffd54f, emissive: 0xffb300, emissiveIntensity: 1.4 })
);
star.position.y = 4.75;
tree.add(star);
const bulbColors = [0xff5252, 0xffd740, 0x40c4ff, 0xb388ff, 0x69f0ae];
const bulbs = [];
for (let i = 0; i < 26; i++) {
  const layer = Math.floor(Math.random() * 4);
  const r = (1.35 - layer * 0.28) * (0.55 + Math.random() * 0.4);
  const a = Math.random() * Math.PI * 2;
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 12, 12),
    new THREE.MeshStandardMaterial({ color: bulbColors[i % 5], emissive: bulbColors[i % 5], emissiveIntensity: 1.2 })
  );
  bulb.position.set(Math.cos(a) * r, 1.0 + layer * 0.85 + Math.random() * 0.3, Math.sin(a) * r);
  tree.add(bulb);
  bulbs.push(bulb);
}
tree.position.set(3.1, 0, -2.6);
tree.scale.setScalar(0.95);
scene.add(tree);

// falling snow
const SNOW = 260;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW * 3);
for (let i = 0; i < SNOW; i++) {
  snowPos[i * 3] = (Math.random() - 0.5) * 14;
  snowPos[i * 3 + 1] = Math.random() * 8;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * 10 - 1;
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.85 }));
scene.add(snow);

// ---------- Materials for Santa (soft, glossy, Pixar-ish) ----------
const skinMat = new THREE.MeshPhysicalMaterial({ color: 0xffc9a3, roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.5 });
const redMat = new THREE.MeshPhysicalMaterial({ color: 0xd8232a, roughness: 0.65, sheen: 1, sheenColor: new THREE.Color(0xff7b7b), sheenRoughness: 0.5 });
const furMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
const blackMat = new THREE.MeshPhysicalMaterial({ color: 0x1a1a1a, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.1 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xffca28, metalness: 0.9, roughness: 0.25 });
const eyeWhiteMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.15, clearcoat: 1 });
const irisMat = new THREE.MeshPhysicalMaterial({ color: 0x2f7fd1, roughness: 0.2, clearcoat: 1 });
const pupilMat = new THREE.MeshBasicMaterial({ color: 0x050a14 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x5a0f1a, roughness: 0.8, side: THREE.DoubleSide });
const tongueMat = new THREE.MeshStandardMaterial({ color: 0xe8707e, roughness: 0.6 });

function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function fluff(radius, mat, x, y, z, sx = 1, sy = 1, sz = 1) {
  const m = mesh(new THREE.SphereGeometry(radius, 28, 22), mat, x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}

// ---------- Build Santa ----------
const santa = new THREE.Group();
scene.add(santa);

// body: a big round tummy
const body = new THREE.Group();
body.add(fluff(0.95, redMat, 0, 1.05, 0, 1, 1.05, 0.92));
// belt and buckle
const belt = mesh(new THREE.TorusGeometry(0.92, 0.09, 16, 48), blackMat, 0, 0.95, 0);
belt.rotation.x = Math.PI / 2;
belt.scale.set(1, 0.9, 1);
body.add(belt);
const buckle = mesh(new THREE.BoxGeometry(0.34, 0.3, 0.08), goldMat, 0, 0.95, 0.86);
body.add(buckle);
body.add(mesh(new THREE.BoxGeometry(0.18, 0.16, 0.09), blackMat, 0, 0.95, 0.87));
// white fur coat trim down the front
const trim = mesh(new THREE.CapsuleGeometry(0.1, 1.1, 8, 16), furMat, 0, 1.15, 0.86);
trim.scale.set(1, 1, 0.55);
body.add(trim);
// buttons
for (const by of [1.45, 1.2, 0.72]) body.add(fluff(0.05, blackMat, 0, by, 0.93));
santa.add(body);

// legs and boots
for (const sx of [-1, 1]) {
  const leg = mesh(new THREE.CapsuleGeometry(0.24, 0.3, 8, 16), redMat, sx * 0.38, 0.32, 0.05);
  const cuff = mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.14, 24), furMat, sx * 0.38, 0.5, 0.05);
  const boot = mesh(new THREE.CapsuleGeometry(0.22, 0.2, 8, 16), blackMat, sx * 0.38, 0.14, 0.18);
  boot.rotation.x = Math.PI / 2; boot.scale.set(1, 1.1, 0.8);
  santa.add(leg, cuff, boot);
}

// arms (pivot at shoulder so they can swing and reach)
function makeArm(side) {
  const pivot = new THREE.Group();
  pivot.position.set(side * 0.92, 1.72, 0.05);
  const upper = mesh(new THREE.CapsuleGeometry(0.2, 0.45, 8, 16), redMat, 0, -0.35, 0);
  const cuff = mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.14, 24), furMat, 0, -0.78, 0);
  const hand = fluff(0.2, furMat, 0, -0.95, 0.02, 1, 1, 0.9);
  const mitten = fluff(0.17, blackMat, 0, -0.95, 0, 1, 1, 1);
  mitten.visible = false;
  const glove = fluff(0.2, skinMat, 0, -0.97, 0.02, 1, 1.05, 0.9);
  pivot.add(upper, cuff, glove);
  pivot.userData.hand = glove;
  // rest pose: slightly out
  pivot.rotation.z = side * 0.28;
  return pivot;
}
const armL = makeArm(-1);
const armR = makeArm(1);
santa.add(armL, armR);

// head group (everything on the head moves together)
const head = new THREE.Group();
head.position.set(0, 2.55, 0.05);
santa.add(head);

// face base
const face = fluff(0.78, skinMat, 0, 0, 0, 1, 0.95, 0.92);
head.add(face);

// cheeks, rosy
const cheekMat = new THREE.MeshStandardMaterial({ color: 0xff8f8f, roughness: 0.8, transparent: true, opacity: 0.55 });
for (const sx of [-1, 1]) head.add(fluff(0.2, cheekMat, sx * 0.43, -0.12, 0.6, 1.2, 0.8, 0.5));

// ears
for (const sx of [-1, 1]) head.add(fluff(0.15, skinMat, sx * 0.75, 0.02, 0, 0.7, 1, 0.8));

// eyes: white, iris, pupil, highlight, and an eyelid that scales to blink
const eyes = [];
for (const sx of [-1, 1]) {
  const eye = new THREE.Group();
  eye.position.set(sx * 0.29, 0.14, 0.62);
  eye.add(fluff(0.17, eyeWhiteMat, 0, 0, 0, 1, 1.15, 0.7));
  const iris = fluff(0.1, irisMat, 0, -0.01, 0.1, 1, 1.05, 0.6);
  const pupil = fluff(0.055, pupilMat, 0, -0.01, 0.15, 1, 1, 0.5);
  const glint = fluff(0.025, new THREE.MeshBasicMaterial({ color: 0xffffff }), 0.04, 0.045, 0.19);
  const look = new THREE.Group();
  look.add(iris, pupil, glint);
  eye.add(look);
  eye.userData.look = look;
  head.add(eye);
  eyes.push(eye);
}

// eyebrows: bushy white
const brows = [];
for (const sx of [-1, 1]) {
  const brow = mesh(new THREE.CapsuleGeometry(0.06, 0.26, 6, 12), furMat, sx * 0.3, 0.42, 0.62);
  brow.rotation.z = Math.PI / 2 + sx * 0.18;
  brow.scale.set(1, 1, 0.8);
  head.add(brow);
  brows.push(brow);
}

// nose: round and rosy
head.add(fluff(0.13, new THREE.MeshPhysicalMaterial({ color: 0xff9a85, roughness: 0.4, clearcoat: 0.4 }), 0, -0.02, 0.76, 1, 0.9, 0.9));

// mouth: a dark ellipse that opens and closes, with a tongue
const mouthGroup = new THREE.Group();
mouthGroup.position.set(0, -0.3, 0.68);
const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), mouthMat);
mouth.scale.set(1, 0.18, 0.45);
const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), tongueMat);
tongue.scale.set(1.1, 0.4, 0.5);
tongue.position.set(0, -0.03, 0.02);
mouthGroup.add(mouth, tongue);
head.add(mouthGroup);

// moustache: two big curly puffs over the mouth
const moustache = new THREE.Group();
for (const sx of [-1, 1]) {
  const puff = fluff(0.27, furMat, sx * 0.24, -0.17, 0.7, 1.35, 0.7, 0.75);
  puff.rotation.z = sx * -0.25;
  const curl = fluff(0.13, furMat, sx * 0.5, -0.1, 0.62, 1, 1, 0.9);
  moustache.add(puff, curl);
}
head.add(moustache);

// beard: a cluster of fluffy balls that wobble when he talks
const beard = new THREE.Group();
beard.position.set(0, -0.35, 0.05);
const beardPuffs = [];
const beardSpots = [
  [0, -0.55, 0.55, 0.42], [-0.32, -0.45, 0.5, 0.36], [0.32, -0.45, 0.5, 0.36],
  [-0.55, -0.15, 0.35, 0.34], [0.55, -0.15, 0.35, 0.34], [-0.2, -0.85, 0.45, 0.3],
  [0.2, -0.85, 0.45, 0.3], [0, -1.05, 0.4, 0.28], [-0.62, -0.5, 0.25, 0.28], [0.62, -0.5, 0.25, 0.28],
  [0, -0.3, 0.6, 0.3]
];
for (const [x, y, z, r] of beardSpots) {
  const p = fluff(r, furMat, x, y, z, 1, 1.1, 0.9);
  p.userData.base = new THREE.Vector3(x, y, z);
  p.userData.phase = Math.random() * 6;
  beard.add(p);
  beardPuffs.push(p);
}
head.add(beard);

// hat: red cone leaning over, fur band and a pom-pom
const hat = new THREE.Group();
hat.position.set(0, 0.5, 0);
const cone = mesh(new THREE.ConeGeometry(0.72, 1.25, 32), redMat, 0, 0.55, 0);
cone.rotation.z = -0.12;
hat.add(cone);
const band = mesh(new THREE.TorusGeometry(0.72, 0.17, 20, 48), furMat, 0, 0.0, 0);
band.rotation.x = Math.PI / 2;
band.scale.set(1, 1, 1.2);
hat.add(band);
const pom = fluff(0.2, furMat, 0.22, 1.12, 0);
hat.add(pom);
head.add(hat);

// extra hat slot (the shop swaps emoji hats in here)
const extraHatCanvas = document.createElement('canvas');
extraHatCanvas.width = extraHatCanvas.height = 256;
const extraHatCtx = extraHatCanvas.getContext('2d');
const extraHatTex = new THREE.CanvasTexture(extraHatCanvas);
const extraHat = new THREE.Sprite(new THREE.SpriteMaterial({ map: extraHatTex, transparent: true }));
extraHat.scale.set(1.1, 1.1, 1);
extraHat.position.set(0, 1.5, 0.2);
extraHat.visible = false;
head.add(extraHat);
function setExtraHat(emoji) {
  extraHatCtx.clearRect(0, 0, 256, 256);
  if (!emoji) { extraHat.visible = false; return; }
  extraHatCtx.font = '190px serif';
  extraHatCtx.textAlign = 'center';
  extraHatCtx.textBaseline = 'middle';
  extraHatCtx.fillText(emoji, 128, 140);
  extraHatTex.needsUpdate = true;
  extraHat.visible = true;
}

santa.position.set(0.5, 0, 0);

// ---------- Cookie and milk props (they sit on the table) ----------
const cookie = new THREE.Group();
const cookieBody = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.06, 28), new THREE.MeshStandardMaterial({ color: 0xc98a45, roughness: 0.9 }), 0, 0, 0);
cookie.add(cookieBody);
for (let i = 0; i < 7; i++) {
  const chip = mesh(new THREE.SphereGeometry(0.035, 8, 8), new THREE.MeshStandardMaterial({ color: 0x3b2314, roughness: 0.8 }),
    (Math.random() - 0.5) * 0.25, 0.03, (Math.random() - 0.5) * 0.25);
  cookie.add(chip);
}
cookie.position.set(-1.9, 1.03, 0.9);
scene.add(cookie);

const glass = new THREE.Group();
const glassBody = mesh(new THREE.CylinderGeometry(0.17, 0.14, 0.4, 24, 1, true),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.28, roughness: 0.05, side: THREE.DoubleSide }), 0, 0, 0);
const milk = mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.3, 24), new THREE.MeshStandardMaterial({ color: 0xfdfdfd, roughness: 0.4 }), 0, -0.04, 0);
milk.userData.full = 0.3;
glass.add(glassBody, milk);
glass.position.set(-1.55, 1.25, 0.9);
scene.add(glass);

// ---------- Animation state shared with Part 2 ----------
const state = {
  talking: false,
  mood: 0,          // 0 calm, 1 happy bounce
  eating: 0,        // 0..1 progress of the cookie or milk animation
  action: null,     // 'cookie' | 'milk' | null
  actionT: 0,
  lookX: 0, lookY: 0,
  blinkT: 0,
  nextBlink: 2,
  mouthOpen: 0,
  cookieBites: 0,
  milkLevel: 1
};

// look toward the finger
function setLook(clientX, clientY) {
  state.lookX = (clientX / window.innerWidth - 0.5) * 2;
  state.lookY = -(clientY / window.innerHeight - 0.5) * 2;
}
canvas.addEventListener('pointermove', e => setLook(e.clientX, e.clientY));

// raycast so a tap on Santa is a tap on Santa
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function hitSanta(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(santa, true).length > 0;
}

// ---------- Main animation loop ----------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let loopHooks = [];            // Part 2 can add per-frame functions here
function onFrame(fn) { loopHooks.push(fn); }

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // breathing and idle sway
  const breathe = Math.sin(t * 1.6) * 0.02;
  body.scale.set(1 + breathe, 1 + breathe * 1.3, 1 + breathe);
  santa.rotation.y = Math.sin(t * 0.5) * 0.06 + state.lookX * 0.18;
  head.rotation.y = state.lookX * 0.35;
  head.rotation.x = -state.lookY * 0.15 + (state.talking ? Math.sin(t * 7) * 0.025 : 0);
  head.rotation.z = Math.sin(t * 0.9) * 0.03;
  santa.position.y = state.mood > 0.01 ? Math.abs(Math.sin(t * 9)) * 0.12 * state.mood : 0;

function reply(text) {
  const t = ' ' + text.toLowerCase().replace(/[^a-z' ]/g, ' ') + ' ';
  const hits = brain.filter(b => b.keys.some(k => t.includes(' ' + k.trim() + ' ') || (k.length > 4 && t.includes(k))));

  if (hits.length) {
    // prefer the most specific (longest keyword) match
    hits.sort((a, b) => Math.max(...b.keys.map(k => k.length)) - Math.max(...a.keys.map(k => k.length)));
    out = pick(hits[0].say);
  } else {
    out = pick(fallbacks);
  }
  if (out === lastReply) out = pick(fallbacks);
  lastReply = out;
  return out;
}

// ---------- Cookie and milk: Santa reaches, grabs, and eats or drinks ----------
const tableCookiePos = new THREE.Vector3(-1.9, 1.03, 0.9);
const tableGlassPos = new THREE.Vector3(-1.55, 1.25, 0.9);
const ease = x => x * x * (3 - 2 * x);

function startAction(kind) {
  if (state.action || speaking) return;
  if (kind === 'cookie' && state.cookieBites >= 4) { state.cookieBites = 0; cookie.visible = true; cookie.scale.setScalar(1); }
  if (kind === 'milk' && state.milkLevel <= 0.05) { state.milkLevel = 1; milk.scale.y = 1; milk.position.y = -0.04; }
  state.action = kind; state.actionT = 0; state.eating = 0;

}

function finishAction() {
  const kind = state.action;
  state.action = null; state.eating = 0;

  cookie.position.copy(tableCookiePos);
  glass.position.copy(tableGlassPos);
  glass.rotation.set(0, 0, 0);
  say(kind === 'cookie'
    ? pick(['Mmm, yum yum yum! Thank you for the cookie!', 'Crunch crunch! That is the best cookie ever!', 'Delicious! Chocolate chip, my favourite!'])

}

onFrame((dt, t) => {
  if (!state.action) return;
  state.actionT += dt;
  const dur = state.action === 'cookie' ? 5.2 : 5.6;
  const p = Math.min(state.actionT / dur, 1);
  state.eating = p;

  const isCookie = state.action === 'cookie';
  const arm = armL;           // Santa's left arm (on screen left) reaches the table
  const item = isCookie ? cookie : glass;
  const itemStart = isCookie ? tableCookiePos : tableGlassPos;

  // where the hand is in the world
  const hand = arm.userData.hand || arm.children[arm.children.length - 1];
  const shoulder = new THREE.Vector3(-0.92, 1.72, 0.05).add(santa.position);
  const mouthWorld = new THREE.Vector3();
  mouth.getWorldPosition(mouthWorld);
  const handHold = mouthWorld.clone().add(new THREE.Vector3(0.05, -0.12, 0.35));

  // phase 1: reach the table 0..0.28, phase 2: carry to mouth 0.28..0.5, phase 3: eat 0.5..0.85, phase 4: put back 0.85..1
  let target = new THREE.Vector3();
  if (p < 0.28) {
    target.lerpVectors(shoulder.clone().add(new THREE.Vector3(-0.2, -0.9, 0.2)), itemStart.clone().add(new THREE.Vector3(0, 0.05, 0.05)), ease(p / 0.28));
  } else if (p < 0.5) {
    target.lerpVectors(itemStart.clone().add(new THREE.Vector3(0, 0.05, 0.05)), handHold, ease((p - 0.28) / 0.22));
  } else if (p < 0.85) {
    target.copy(handHold);

    target.y += Math.sin(p * 60) * 0.025;
  } else {
    target.lerpVectors(handHold, shoulder.clone().add(new THREE.Vector3(-0.35, -0.9, 0.25)), ease((p - 0.85) / 0.15));
  }

  // point the arm at the target
  const dx = target.x - shoulder.x, dy = target.y - shoulder.y, dz = target.z - shoulder.z;
  arm.rotation.z = Math.atan2(-dx, -dy) * 1.0;
  arm.rotation.x = Math.atan2(dz, -dy) * 0.9;

  if (p >= 0.1 && p < 0.88) {
    item.position.copy(target);
    if (!isCookie) {

  // the cookie reappears fresh when it was finished
  if (p >= 1) {
    if (isCookie && state.cookieBites >= 4) { cookie.visible = true; cookie.scale.setScalar(1); state.cookieBites = 0; }
    finishAction();
  }
});

$('cookieBtn').addEventListener('click', () => startAction('cookie'));
$('milkBtn').addEventListener('click', () => startAction('milk'));

// ---------- Hat shop ----------
const hats = [
  { icon: '', cost: 0 }, { icon: '👑', cost: 10 }, { icon: '🎩', cost: 15 },
  { icon: '🎓', cost: 20 }, { icon: '🕶️', cost: 25 }, { icon: '🦌', cost: 30 }
];
function drawShop() {
  const list = $('hatList');
  list.innerHTML = '';
  hats.forEach(h => {
    const b = document.createElement('button');
    b.className = 'hatBtn';
    const owned = save.owned.includes(h.icon);
    b.innerHTML = (h.icon || '🚫') + '<small>' + (owned ? 'Wear' : '🪙 ' + h.cost) + '</small>';
    b.onclick = () => {
      if (owned) { save.hat = h.icon; }
      else if (save.coins >= h.cost) { save.coins -= h.cost; save.owned.push(h.icon); save.hat = h.icon; say('Ooh, I love it!'); }
      else { say('You need more coins! Help me wrap some gifts!'); }
      store(); refresh(); drawShop();
    };
    list.appendChild(b);
  });
}
$('shopBtn').onclick = () => { drawShop(); $('shop').style.display = 'flex'; };
$('closeShop').onclick = () => { $('shop').style.display = 'none'; };

// ---------- Gift game ----------
const game = $('game');
let score = 0, timeLeft = 30, spawner, ticker, running = false;
const giftIcons = ['🎁', '🎀', '🧸', '⭐'];
function spawnGift() {
  const g = document.createElement('div');
  g.className = 'gift';
  g.textContent = pick(giftIcons);
  g.style.left = Math.random() * (window.innerWidth - 80) + 'px';
  g.style.top = '60px';
  game.appendChild(g);
  let y = 60;
  const speed = 2 + Math.random() * 2.5;
  const fall = setInterval(() => {
    y += speed; g.style.top = y + 'px';
    if (y > window.innerHeight) { clearInterval(fall); g.remove(); }
  }, 16);
  const popIt = () => {
    if (!running) return;
    score++; $('score').textContent = score;
    g.textContent = '✨'; clearInterval(fall);
    setTimeout(() => g.remove(), 200);
  };
  g.addEventListener('touchstart', e => { e.preventDefault(); popIt(); });
  g.addEventListener('mousedown', popIt);
}
function startGame() {
  if (speaking || state.action) return;
  stopListening();
  score = 0; timeLeft = 30; running = true;
  $('score').textContent = 0; $('timer').textContent = 30;
  game.style.display = 'block';
  spawner = setInterval(spawnGift, 600);
  ticker = setInterval(() => {
    timeLeft--; $('timer').textContent = timeLeft;
    if (timeLeft <= 0) endGame(true);
  }, 1000);
}
function endGame(finished) {
  running = false;
  clearInterval(spawner); clearInterval(ticker);
  game.querySelectorAll('.gift').forEach(g => g.remove());
  game.style.display = 'none';
  if (finished) {
    save.coins += score; store(); refresh();
    say('You wrapped ' + score + ' presents! Ho ho ho, what a helper!');
  } else {
    setTimeout(startListening, 300);
  }
}
$('giftBtn').onclick = startGame;
$('closeGame').onclick = () => endGame(false);
</script>
